# Configuration Features
[params]
  description = "Belltown Seattle machine shop for CNC machining, waterjet cutting, laser engraving, rapid prototyping, PCB design, and 3D printing."      # Your meta description of the site
  header_title = "Future Present Labs - Seattle Machine Shop"                 # Your header title
  header_subtitle = "Bringing the future to the present. Est. 2018" # Your header subtitle
  home_image = "/images/fpl_square.png"          # Path to header image starting from the static directory (optional)
  recent_posts = 5                           # Max amount of recent posts to show
  mainSections = ["post"]   # Main sections to include in recent posts
  [params.hero]
    eyebrow = "Integrated engineering + manufacturing"
    title = "From Complex Idea to Precision Part, Faster."
    summary = "Future Present Labs is a small Belltown, Seattle machine shop. Our capabilities include 4-axis CNC milling, CNC turning, WAZER abrasive waterjet cutting, MOPA fiber laser engraving, PCB design, 3D printing, silicon mold-making, and cerakoting. We help nearby teams go from CAD to finished parts without waiting weeks for a big vendor."
    panel_eyebrow = "By the numbers"
    panel_summary = "Most repeat work starts within a business day. Below are a few stats about what we're up to."
  [params.home_cta]
    # label = "Start an Instant Quote"
    # url = "https://quote.fpl.dev/"
    label = "Get in Touch"
    url = "/contact"
  [params.style]                             # CSS style overrides
    backgroundColor = "#f8f9fa"
    homeImageBorderColor = "#ffffff"
    fontFamilyBase = "Helvetica Neue"        # First-choice font
    fontColor = "#212529"
  [[params.social]]
    fa_icon = "fab fa-github fa-1x"          # Font Awesome icon class
    href = "http://github.com/FuturePresentLabs"      # Link to associate with icon (http://, https://, mailto:)
  [[params.social]]
    fa_icon = "fas fa-envelope fa-1x"
    href = "mailto:futurepresentlabs@proton.me"
  [[params.social]]
    fa_icon = "fab fa-instagram fa-1x"
    href = "https://instagram.com/futurepresentlabs"
  # [[params.social]]
