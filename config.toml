  [[params.hero_stats]]
    value = "1,000+  "
    label = "Parts made and shipped last month"
  [[params.hero_stats]]
    value = "24 hr"
    label = "Lead time to start repeat work"
  [[params.hero_stats]]
    value = "0.001\""
    label = "Tight tolerances where you need them"

  [params.how_we_work]
    headline = "How We Work"
    [[params.how_we_work.steps]]
      title = "Click"
      body = "Share the files: Upload CAD, prints, or even a quick sketch. We’ll confirm feasibility, materials, and schedule."
    [[params.how_we_work.steps]]
      title = "Build"
      body = "We machine in-house: Programming, machining, light printing, and inspection all happen in the same Seattle shop."
    [[params.how_we_work.steps]]
      title = "Ship"
      body = "Review & iterate: You get photos, measurement notes, and parts packed for the next round of testing."

  [[params.capabilities]]
    title = "CNC machining"
    url = "/seattle-manufacturing/cnc-machining-seattle/"
    body = "4-axis milling in aluminum, stainless, brass, titanium, and engineering plastics. Setups stay ready for quick reruns."
    bullets = ["Prototyping and production runs", "Custom Fixturing", "Surface finishing through local partners"]
  [[params.capabilities]]
    title = "CNC turning"
    url = "/seattle-manufacturing/cnc-turning-seattle/"
    body = "Lathe Turning for bushings, shafts, and housings with hand-fit checks before shipping."
    bullets = ["Brass, Aluminum, Delrin & More", "Threading, grooving, and parting tools on-hand", "From 5 parts to 500+"]
  [[params.capabilities]]
    title = "3D printing"
    url = "/seattle-manufacturing/3d-printing-seattle/"
    body = "Carbon-filled nylon and engineering-grade plastics for tooling, fixtures, and workholding."
    bullets = ["Printer-ready in hours for fixtures or quick parts", "Hybrid Carbon Nylon prints + machined plates for rigid tooling", "Bulk PA6-CF Parts"]
  [[params.capabilities]]
    title = "Waterjet cutting"
    url = "/seattle-manufacturing/waterjet-cutting-seattle/"
    body = "WAZER abrasive waterjet cutting for metals, plastics, composites, rubber, and gasket materials without heat-affected edges."
    bullets = ["DXF, STEP, and sketch-to-cut support", "Great for brackets, panels, shims, and blanks", "Machined finishing available after cutting"]
  [[params.capabilities]]
    title = "Laser engraving"
    url = "/seattle-manufacturing/laser-engraving-seattle/"
    body = "MOPA fiber laser engraving for permanent part IDs, serial numbers, branding, panels, and short-run product details."
    bullets = ["Aluminum, stainless, plastics, coated parts, and wood", "Batch serialization and layout support", "Engraving paired with machining or assembly"]
  [[params.capabilities]]
    title = "PCB design"
    url = "/seattle-manufacturing/pcb-design-seattle/"
    body = "Circuit board design, bring-up, and test support for embedded products, fixtures, and hardware prototypes."
    bullets = ["Schematic capture and board layout", "Prototype assembly and bench debugging", "Firmware and test integration"]
  [[params.capabilities]]
    title = "Software Development"
    body = "Lightweight firmware, scripts, and automation to get business problems solved fast."
    bullets = ["Inventory management + e-commerce", "Data logging or control scripts for test rigs", "Apps to link tooling, machining, and reporting"]

