{{- $section := site.GetPage "section" "seattle-manufacturing" -}}
{{- if $section -}}
<div class="capabilities-grid seo-collection-grid">
  {{- range $section.Pages.ByTitle -}}
    <article class="cap-card">
      <h4><a href="{{ .RelPermalink }}">{{ .Title }}</a></h4>
      {{- with .Description }}<p>{{ . }}</p>{{ end -}}
    </article>
  {{- end -}}
</div>
{{- end -}}
